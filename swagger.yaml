openapi: 3.0.0
info:
  title: TheRedGeek API
  version: 1.0.0
  description: Blog and User API documentation
servers:
  - url: http://localhost:5000
paths:
  /api/blogs:
    get:
      summary: Get all blogs
      tags:
        - Blogs
      responses:
        '200':
          description: List of blogs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Blog'
    post:
      summary: Create a new blog
      tags:
        - Blogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blog'
      responses:
        '201':
          description: Blog created
  /api/blogs/{id}:
    get:
      summary: Get blog by ID
      tags:
        - Blogs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Blog found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'
        '404':
          description: Blog not found
    put:
      summary: Update blog
      tags:
        - Blogs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blog'
      responses:
        '200':
          description: Blog updated
        '404':
          description: Blog not found
    delete:
      summary: Delete blog
      tags:
        - Blogs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Blog deleted
        '404':
          description: Blog not found
components:
  schemas:
    Blog:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        excerpt:
          type: string
        author:
          type: string
        publishedAt:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        readTime:
          type: integer
        imageUrl:
          type: string
      required:
        - title
        - content
        - excerpt
        - author
        - publishedAt
        - category
        - tags
        - readTime
        - imageUrl
